spring:
  datasource:
    url: jdbc:h2:mem:user_order_auth;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      repositories:
        enabled: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liushipin.userorderauthsystem.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  redis:
    permission-cache-ttl: 30m
    login-failure-window: 15m
    max-login-failures: 5
