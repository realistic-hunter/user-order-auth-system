spring:
  datasource:
    url: jdbc:mysql://localhost:3306/user_order_auth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.liushipin.userorderauthsystem.entity
  configuration:
    map-underscore-to-camel-case: true

app:
  security:
    jwt:
      secret: ${JWT_SECRET:user-order-auth-system-default-jwt-secret-please-change}
      expiration: 24h
  redis:
    permission-cache-ttl: 30m
    login-failure-window: 15m
    max-login-failures: 5
